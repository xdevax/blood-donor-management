services:
  backend1:
    build: ./backend
    image: blood-donor-backend
    container_name: backend1
    env_file: ./backend/.env
    environment:
      - INSTANCE_ID=backend1
      - PORT=5000
    ports:
      - "5001:5000"
    restart: "no"

  backend2:
    image: blood-donor-backend
    container_name: backend2
    env_file: ./backend/.env
    environment:
      - INSTANCE_ID=backend2
      - PORT=5000
    ports:
      - "5002:5000"
    depends_on:
      - backend1
    restart: "no"

  backend3:
    image: blood-donor-backend
    container_name: backend3
    env_file: ./backend/.env
    environment:
      - INSTANCE_ID=backend3
      - PORT=5000
    ports:
      - "5003:5000"
    depends_on:
      - backend1
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
