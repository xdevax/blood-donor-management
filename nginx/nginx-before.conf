events { worker_connections 1024; }

http {
  log_format lb '$remote_addr -> $upstream_addr [$status/$upstream_status] $request_time "$request"';
  access_log /var/log/nginx/access.log lb;

  upstream blood_api {
    server backend1:5000 max_fails=0;
    server backend2:5000 max_fails=0;
    server backend3:5000 max_fails=0;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://blood_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header X-Upstream $upstream_addr always;
      proxy_next_upstream off;     # no retry -> requests to a dead instance fail with 502
      proxy_connect_timeout 2s;
    }
  }
}
