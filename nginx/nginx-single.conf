events { worker_connections 1024; }

http {
  upstream blood_api {
    server backend1:5000;
    keepalive 32;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://blood_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
