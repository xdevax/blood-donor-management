  # CLOUD BURSTING (not active locally): add to upstream blood_api:
  #   server blood-donor-api-q1jg.onrender.com:443 backup;
  # and in location: proxy_ssl_server_name on; proxy_set_header Host blood-donor-api-q1jg.onrender.com;
  # (Would also require proxy_pass https:// for that upstream — keep as documentation.)

events { worker_connections 1024; }

http {
  log_format lb '$remote_addr -> $upstream_addr [$status/$upstream_status] $request_time "$request"';
  access_log /var/log/nginx/access.log lb;

  upstream blood_api {
    # Round-robin across 3 instances; a failed instance is taken out for 10s
    server backend1:5000 max_fails=1 fail_timeout=10s;
    server backend2:5000 max_fails=1 fail_timeout=10s;
    server backend3:5000 max_fails=1 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://blood_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Upstream $upstream_addr always;

      # Fault tolerance: retry failed requests on another healthy instance
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 10s;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }
  }
}
